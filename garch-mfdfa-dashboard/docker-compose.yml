services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    # No host port published: the backend is reached only through the
    # frontend's nginx /api proxy over the internal Docker network.
    # Uncomment to expose the API/docs directly for debugging:
    # ports:
    #   - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
