server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow larger request bodies for CSV uploads (/api/upload).
    client_max_body_size 50M;

    # Reverse-proxy API calls to the backend container.
    # The trailing slash on proxy_pass strips the /api/ prefix:
    #   /api/btc-data  ->  http://backend:8000/btc-data
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # GARCH / MF-DFA fitting can take a while.
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback: let the client-side app handle unknown routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
